<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>
    <header>
        <h1>Sistema de Agendamento</h1>
    </header>

    <main>
        <div>
        <form id="form-agendamento">
            <input type="date" id="data" min="2026-01-02" max="2026-12-31">
            <div id="horarios"></div>
            <div id="horario-atual"></div>
            <input type="text" id="nome" placeholder="Nome">
        </form>
        <button id="confirmar">Confirmar agendamento</button>
        </div>

        <button id="visualizar">Visualizar agendamentos</button>
        <div id="agenda"></div>
    </main>

    <footer>
        <p>Elis Rodrigues Borges © 2026</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
